# Coleta agendada do CGE, a cada 10 min. Grava o HTML bruto na branch `dados`
# (a `main` fica só com código). Até 2h da manhã também revisa o dia anterior.
# Pode ser disparada à mão em Actions → coleta → Run workflow, opcionalmente
# com uma lista de datas para recoletar (ex.: dias que falharam no backfill).
name: coleta

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      datas:
        description: "Datas para recoletar (AAAA-MM-DD separadas por espaço). Vazio = coleta normal de hoje."
        required: false

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: collector/go.mod
          cache: false

      - name: Compilar coletor
        working-directory: collector
        run: go build -o "$RUNNER_TEMP/coletor" ./cmd/coletor

      - name: Preparar branch dados
        run: bash .github/scripts/dados.sh preparar

      - name: Coletar
        env:
          DATAS: ${{ inputs.datas }}
        run: |
          if [ -n "$DATAS" ]; then
            falhou=0
            for d in $DATAS; do
              "$RUNNER_TEMP/coletor" dia -data "$d" -raiz dados/raw || falhou=1
              sleep 5
            done
            exit $falhou
          fi
          if [ "$(TZ=America/Sao_Paulo date +%-H)" -lt 2 ]; then
            "$RUNNER_TEMP/coletor" dia -data ontem -raiz dados/raw
            sleep 5
          fi
          "$RUNNER_TEMP/coletor" dia -data hoje -raiz dados/raw

      - name: Commit na branch dados
        if: ${{ !cancelled() }}
        run: bash .github/scripts/dados.sh commit "coleta $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
