[project]
name = "sp-alagamentos-analysis"
version = "0.1.0"
description = "Análise do histórico de alagamentos de São Paulo (CGE) e da chuva (CEMADEN)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.10",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "pytest>=9.2.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sp_alagamentos"]

[tool.ruff]
line-length = 100
